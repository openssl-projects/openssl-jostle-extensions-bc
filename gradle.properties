# Compatibility libraries for the OpenSSL Jostle (JSL) provider, rebuilt from bc-java.
# A release build takes its version from a git tag instead: -PreleaseTag=<tag> (see build.gradle).
version=1.86.1-SNAPSHOT

# Upper bound (exclusive) for the OSGi Import-Package version range on org.bouncycastle.jsl.*.
maxVersion=1.87

# Version of the jostle provider these libraries are built against. Also the
# openssl-jostle dependency version written into the published POMs.
jostleVersion=0.1.0

# The build fetches org.openssl.jostle:openssl-jostle:<jostleVersion>:<arch> from Maven Central,
# with <arch> (aarch64 or x86_64) detected from os.arch. Override with -PjostleClassifier=<arch>,
# or use a local provider build with -PjostleJar=<path>.


# Publication coordinate and licence. Read by the root build; a publish fails loudly if any is
# unset rather than staging a half-configured POM.
jslGroupId=org.openssl.jostle.bc
jslLicenceName=Bouncy Castle Licence
jslLicenceUrl=https://www.bouncycastle.org/licence.html

# Project home and source repository, written into the published POMs' <url> and <scm>.
jslProjectUrl=https://github.com/openssl-projects/openssl-jostle-extensions-bc
jslScmUrl=https://github.com/openssl-projects/openssl-jostle-extensions-bc

org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=BC_JDK8,BC_JDK11,BC_JDK17,BC_JDK21,BC_JDK25
