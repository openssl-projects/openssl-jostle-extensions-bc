# Compatibility libraries for the OpenSSL Jostle (JSL) provider, rebuilt from bc-java.
version=1.86.0-SNAPSHOT

# Upper bound (exclusive) for the OSGi Import-Package version range on org.bouncycastle.*.
maxVersion=1.87

# Version of the jostle provider these libraries are built against
# (matches the artifact in libs/ and the openssl-jostle repo).
jostleVersion=0.1-SNAPSHOT


# Publication coordinate and licence. Read by the root build; a publish fails loudly if any is
# unset rather than staging a half-configured POM.
jslGroupId=org.bouncycastle.jsl
jslLicenceName=Bouncy Castle Licence
jslLicenceUrl=https://www.bouncycastle.org/licence.html

# Deliberately UNSET: this fork's public home is not decided, and pointing a published POM at
# bc-java's would send consumers to the wrong project. The publish guard fails until they are set.
#jslProjectUrl=
#jslScmUrl=

org.gradle.jvmargs=-Xmx2g
org.gradle.configuration-cache=false
org.gradle.java.installations.auto-detect=false
org.gradle.java.installations.auto-download=false
org.gradle.java.installations.fromEnv=BC_JDK8,BC_JDK11,BC_JDK17,BC_JDK21,BC_JDK25
