// Root build for the OpenSSL Jostle (JSL) compatibility libraries.
//
// Each subproject is rebuilt from bc-java sources but compiled against the
// minimal `core` module (asn.1 + util + supporting classes) and the jostle
// provider jar in libs/, instead of bcprov. Crypto is delegated to OpenSSL via
// the JSL provider through JCA/JCE.

plugins {
    // OSGi bundle metadata via bnd (matches bc-java's use of the bnd builder).
    id 'biz.aQute.bnd.builder' version '7.0.0' apply false
}

def jostleJar = { -> rootProject.file("libs/openssl-jostle-${jostleVersion}.jar") }

// Derive an OSGi-legal bundle version from the project version (mirrors bc-java):
// snapshots extend to a fourth, time-based qualifier (days since epoch).
static String deriveOSGIVersion(String prjVersion) {
    if (prjVersion.contains("-SNAPSHOT")) {
        prjVersion = prjVersion.replace("-SNAPSHOT", "")
        while (prjVersion.count(".") < 2) {
            prjVersion = prjVersion + ".0"
        }
        prjVersion = prjVersion + "." + System.currentTimeMillis().intdiv(1000L).intdiv(60).intdiv(60).intdiv(24)
    }
    return prjVersion
}

ext.bundle_version = deriveOSGIVersion(version.toString())

// `Export-Package` is a bnd PULL instruction: it copies every matching package off the
// build classpath into the bundle, which is how bcutil-jsl re-shipped seven of core's
// asn1 packages. `-exportcontents` only describes what the jar already holds, so one
// broad pattern is safe and no per-module list has to be kept in step with the tree.
// The exclusion mirrors bc-java prov/build.gradle:261; the fork carries none today.
ext.osgiExportPattern = '!org.bouncycastle.internal.*,org.bouncycastle.*'

allprojects {
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'biz.aQute.bnd.builder'

    repositories {
        mavenCentral()
    }

    // Built from bc-java sources that target Java 8.
    compileJava {
        options.release = 8
        options.debug = true
    }
    compileTestJava {
        options.release = 8
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }

    // Shared test-only support (JslTestProvider) compiled into every module's test source set;
    // the modules do not otherwise share test code.
    sourceSets {
        test {
            java {
                srcDir rootProject.file('testsupport/src/main/java')
            }
        }
    }

    // Every module's tests need the provider jar on the test classpath, including core's (which
    // has none of its own yet) so the shared support class compiles. Resolved lazily:
    // jostleProviderJar() is defined further down this file, after this block is evaluated.
    dependencies {
        testImplementation files({ rootProject.jostleProviderJar() })
    }

    // The suite always runs against JSL. When TEST_FIPS_LIB names a FIPS module, `fipsTest` runs
    // the same classes again against JSLFIPS; tests needing an algorithm the FIPS module does not
    // implement skip themselves via JslTestProvider.assumeAlgorithm.
    //
    // TEST_FIPS_LIB is declared as a task input on purpose. Gradle's up-to-date check hashes task
    // inputs, not the environment, so without this a task that last ran with the variable unset is
    // considered UP-TO-DATE when re-run with it set and replays a cached all-skipped result as
    // BUILD SUCCESSFUL in milliseconds. (Bitten in the openssl-jostle repo; see
    // .claude/guides/testing.md.)
    tasks.register('fipsTest', Test) {
        description = 'Runs the test suite against the JSLFIPS provider (requires TEST_FIPS_LIB).'
        group = 'verification'

        onlyIf { System.getenv('TEST_FIPS_LIB') != null }

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        systemProperty 'test.jsl.provider', 'JSLFIPS'
        inputs.property('fipsLib', System.getenv('TEST_FIPS_LIB') ?: '')
    }

    // Same reasoning for the ordinary test task: it registers JSLFIPS too when the variable is
    // set, so its result depends on the variable as well.
    tasks.named('test').configure {
        inputs.property('fipsLib', System.getenv('TEST_FIPS_LIB') ?: '')
    }

    // core carries no tests of its own, but it still compiles the shared test support above, so
    // "sources present, nothing discovered" is expected rather than a misconfiguration.
    tasks.withType(Test).configureEach {
        failOnNoDiscoveredTests = false
    }

    // Each leg is followed by a gate summary. A junit.framework.TestCase gate returns early and
    // JUnit records that as a PASS, so a JSLFIPS leg reads as "412 tests, 0 failures" while a large
    // fraction of them did nothing - measured 2026-09-08 as 108 of 412 on a 3.5.8 module and 125 on
    // a 3.1.2 one, against 5 and 16 reported skips. Every gate prints a "[skipped]" line, so
    // counting those beside the skips Gradle reports makes the gap visible without reading the XML.
    //
    // Two deliberate choices. It is wired with finalizedBy rather than doLast, because a Test task
    // throws on failure inside its own action and doLast would then be skipped - exactly when the
    // summary matters most. And the count is of MARKER LINES, i.e. gated executions rather than
    // distinct tests: Gradle writes <system-out> at suite level, not per <testcase>, so per-test
    // attribution is not recoverable from the XML. The line says so rather than implying precision
    // it does not have.
    ['test', 'fipsTest'].each { legName ->
        def summary = tasks.register("${legName}GateSummary") {
            description = "Counts gated executions beside reported skips for ${legName}."
            def xmlDir = layout.buildDirectory.dir("test-results/${legName}")
            def moduleName = project.name

            // Mirror the leg's own onlyIf. Without this, a run with TEST_FIPS_LIB unset skips
            // fipsTest but the summary still finds the PREVIOUS run's XML and reports it as though
            // this run had produced it.
            if (legName == 'fipsTest')
            {
                onlyIf { System.getenv('TEST_FIPS_LIB') != null }
            }

            doLast {
                def dir = xmlDir.get().asFile
                if (!dir.isDirectory())
                {
                    return
                }

                int tests = 0, failed = 0, skips = 0, silent = 0
                dir.listFiles()?.each { f ->
                    if (!f.name.endsWith('.xml'))
                    {
                        return
                    }
                    def suite = new groovy.xml.XmlSlurper().parse(f)
                    tests  += ((suite.@tests.text() ?: '0') as int)
                    failed += ((suite.@failures.text() ?: '0') as int) + ((suite.@errors.text() ?: '0') as int)
                    skips  += ((suite.@skipped.text() ?: '0') as int)
                    silent += f.text.count('[skipped]')
                }

                if (tests > 0)
                {
                    logger.lifecycle("${moduleName} ${legName}: tests=${tests} failures=${failed}" +
                        " reported-skips=${skips} silent-skips=${silent}" +
                        " (silent-skips = gated executions, not distinct tests)")
                }
            }
        }

        tasks.named(legName).configure { finalizedBy(summary) }
    }

    // The compat artifact name carries the -jsl qualifier (bccore-jsl, bcutil-jsl, ...).
    ext.artifactBaseName = "bc${project.name == 'core' ? 'core' : project.name}-jsl"

    afterEvaluate {
        jar {
            archiveBaseName = project.ext.artifactBaseName

            // OSGi bundle headers (processed by the bnd builder plugin).
            String v = rootProject.ext.bundle_version
            String rawExports = rootProject.ext.osgiExportPattern
            // Attach ;version to each exported package clause (skip bnd exclusions).
            String exportHeader = rawExports.split(',').collect { c ->
                c.startsWith('!') ? c : "${c};version=${v}"
            }.join(',')

            manifest.attributes(
                "Specification-Vendor"      : "BouncyCastle.org",
                "Specification-Version"     : "1.0",
                "Implementation-Vendor"     : "BouncyCastle.org",
                "Implementation-Version"    : project.version,
                "Automatic-Module-Name"     : "org.bouncycastle.jsl.${project.name}",
                "Bundle-Name"               : project.ext.artifactBaseName,
                "Bundle-SymbolicName"       : project.ext.artifactBaseName,
                "Bundle-Version"            : v,
                "Bundle-RequiredExecutionEnvironment" : "JavaSE-1.8",
                "-exportcontents"           : exportHeader,
                "Import-Package"            : "java.*;resolution:=optional,javax.*;resolution:=optional,org.bouncycastle.*;version=\"[${v},${project.maxVersion})\",*"
            )
        }

        task sourcesJar(type: Jar, dependsOn: classes) {
            archiveBaseName = project.ext.artifactBaseName
            archiveClassifier = 'sources'
            from sourceSets.main.allSource
        }

        task javadocJar(type: Jar, dependsOn: javadoc) {
            archiveBaseName = project.ext.artifactBaseName
            archiveClassifier = 'javadoc'
            from javadoc.destinationDir
        }

        artifacts {
            archives jar
            archives sourcesJar
            archives javadocJar
        }
    }
}

// Three assertions, each falsified RED on its own before this landed: the bundle holds
// what the module compiled (catches a pattern that pulls a package nothing else owns),
// exports everything it holds (catches a package silently left unexported), and shares
// no package with another bundle (the split that fails module-path resolution).
tasks.register('checkBundlePackages') {
    description = 'Asserts each bundle holds exactly the packages its module compiled, exports all of them, and shares none.'
    group = 'verification'

    def jars = subprojects.collectEntries { sp ->
        [(sp.name): [jar    : sp.tasks.named('jar').flatMap { it.archiveFile },
                     classes: sp.sourceSets.main.output.classesDirs]]
    }
    dependsOn subprojects.collect { it.tasks.named('jar') }

    doLast {
        // Split an OSGi header on its top-level commas: a clause's uses:= and version
        // attributes carry quoted commas of their own.
        def clausesOf = { String header ->
            def out = []
            def cur = new StringBuilder()
            boolean quoted = false
            header.each { ch ->
                if (ch == '"')
                {
                    quoted = !quoted
                    cur.append(ch)
                }
                else if (ch == ',' && !quoted)
                {
                    out << cur.toString()
                    cur = new StringBuilder()
                }
                else
                {
                    cur.append(ch)
                }
            }
            out << cur.toString()
            out*.trim().findAll { !it.isEmpty() }
        }

        def held = [:]
        def problems = []

        jars.each { name, loc ->
            def inJar = [] as Set
            def exported = [] as Set

            new java.util.jar.JarFile(loc.jar.get().asFile).withCloseable { jf ->
                jf.entries().each { e ->
                    if (e.name.endsWith('.class') && e.name.contains('/'))
                    {
                        inJar << e.name.substring(0, e.name.lastIndexOf('/')).replace('/', '.')
                    }
                }
                String header = jf.manifest?.mainAttributes?.getValue('Export-Package') ?: ''
                clausesOf(header).each { c ->
                    if (!c.startsWith('!'))
                    {
                        exported << (c.contains(';') ? c.substring(0, c.indexOf(';')) : c)
                    }
                }
            }

            def compiled = [] as Set
            loc.classes.each { dir ->
                if (dir.isDirectory())
                {
                    fileTree(dir).matching { include '**/*.class' }.each { f ->
                        def rel = dir.toPath().relativize(f.toPath()).toString()
                        if (rel.contains(File.separator))
                        {
                            compiled << rel.substring(0, rel.lastIndexOf(File.separator)).replace(File.separator, '.')
                        }
                    }
                }
            }

            def pulled = inJar - compiled
            def lost = compiled - inJar
            def unexported = inJar - exported
            def phantom = exported - inJar

            if (!pulled.isEmpty())
            {
                problems << "${name}: bundle carries ${pulled.size()} package(s) the module never compiled: ${pulled.sort()}"
            }
            if (!lost.isEmpty())
            {
                problems << "${name}: bundle is missing ${lost.size()} compiled package(s): ${lost.sort()}"
            }
            if (!unexported.isEmpty())
            {
                problems << "${name}: bundle holds ${unexported.size()} package(s) it does not export: ${unexported.sort()}"
            }
            if (!phantom.isEmpty())
            {
                problems << "${name}: bundle exports ${phantom.size()} package(s) it does not hold: ${phantom.sort()}"
            }

            held[name] = inJar
        }

        def owners = [:].withDefault { [] }
        held.each { name, pkgs -> pkgs.each { owners[it] << name } }
        owners.findAll { pkg, mods -> mods.size() > 1 }.sort().each { pkg, mods ->
            problems << "split package ${pkg} is held by ${mods.sort()}"
        }

        if (!problems.isEmpty())
        {
            throw new GradleException("bundle package check failed:\n  " + problems.join("\n  "))
        }

        logger.lifecycle("bundle package check: ${held.size()} bundles, " +
            "${held.values().sum { it.size() }} packages, each compiled, exported and owned once")
    }
}

subprojects { sp -> sp.tasks.named('check').configure { dependsOn rootProject.tasks.named('checkBundlePackages') } }

// Convenience accessor for the jostle provider jar used by subprojects.
ext.jostleProviderJar = jostleJar
