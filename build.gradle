// Root build for the OpenSSL Jostle (JSL) compatibility libraries.
//
// Each subproject is rebuilt from bc-java sources but compiled against the
// minimal `core` module (asn.1 + util + supporting classes) and the jostle
// provider jar in libs/, instead of bcprov. Crypto is delegated to OpenSSL via
// the JSL provider through JCA/JCE.

plugins {
    // OSGi bundle metadata via bnd (matches bc-java's use of the bnd builder).
    id 'biz.aQute.bnd.builder' version '7.0.0' apply false
}

def jostleJar = { -> rootProject.file("libs/openssl-jostle-${jostleVersion}.jar") }

// Derive an OSGi-legal bundle version from the project version (mirrors bc-java):
// snapshots extend to a fourth, time-based qualifier (days since epoch).
static String deriveOSGIVersion(String prjVersion) {
    if (prjVersion.contains("-SNAPSHOT")) {
        prjVersion = prjVersion.replace("-SNAPSHOT", "")
        while (prjVersion.count(".") < 2) {
            prjVersion = prjVersion + ".0"
        }
        prjVersion = prjVersion + "." + System.currentTimeMillis().intdiv(1000L).intdiv(60).intdiv(60).intdiv(24)
    }
    return prjVersion
}

ext.bundle_version = deriveOSGIVersion(version.toString())

// `Export-Package` is a bnd PULL instruction: it copies every matching package off the
// build classpath into the bundle, which is how bcutil-jsl re-shipped seven of core's
// asn1 packages. `-exportcontents` only describes what the jar already holds, so one
// broad pattern is safe and no per-module list has to be kept in step with the tree.
// The exclusion mirrors bc-java prov/build.gradle:261; the fork carries none today.
ext.osgiExportPattern = '!org.bouncycastle.jsl.internal.*,org.bouncycastle.jsl.*'

// What each module-info.java requires of the others, so compileJava9Java can put those jars on
// --module-path. Kept beside the descriptors it serves; the descriptors remain the source of truth.
ext.moduleRequires = [
    core: [], util: ['core'], pkix: ['core', 'util'],
    pg: ['core', 'util'], tls: ['core', 'util'], mail: ['core', 'util', 'pkix'],
]

// A publication must not stage with a placeholder in it: every coordinate, licence and URL is
// read through here, and a missing one fails the build with the property name rather than writing
// "unspecified" into a POM someone later uploads.
ext.publishProperty = { String name ->
    def value = rootProject.findProperty(name)
    if (value == null || value.toString().trim().isEmpty())
    {
        throw new GradleException("publication property '${name}' is not set; see gradle.properties")
    }
    return value.toString()
}

allprojects {
    tasks.withType(Javadoc).configureEach {
        options.addStringOption('Xdoclint:none', '-quiet')
    }
}

subprojects {
    apply plugin: 'java'
    apply plugin: 'maven-publish'
    apply plugin: 'biz.aQute.bnd.builder'

    repositories {
        mavenCentral()
    }

    // Built from bc-java sources that target Java 8.
    compileJava {
        options.release = 8
        options.debug = true
    }
    compileTestJava {
        options.release = 8
    }

    dependencies {
        testImplementation 'junit:junit:4.13.2'
    }

    // Shared test-only support (JslTestProvider) compiled into every module's test source set;
    // the modules do not otherwise share test code.
    sourceSets {
        test {
            java {
                srcDir rootProject.file('testsupport/src/main/java')
            }
        }
    }

    // module-info.java needs release 9 and main compiles at release 8, so the descriptor gets its
    // own source set and is shipped under META-INF/versions/9 where a release-8 consumer never
    // looks. Extra module-path entries (the provider jar, mail's javax jars and stubs) come from
    // java9ExtraModulePath, which a module sets for itself.
    sourceSets {
        java9 {
            java {
                srcDirs = ['src/main/java9']
            }
        }
    }

    // A closure, not a list: jostleProviderJar() is defined at the foot of this file, after
    // this block is evaluated.
    ext.java9ExtraModulePath = { -> [rootProject.jostleProviderJar()] }

    dependencies {
        java9Implementation files(sourceSets.main.output.classesDirs) {
            builtBy compileJava
        }
    }

    // Every module's tests need the provider jar on the test classpath, including core's (which
    // has none of its own yet) so the shared support class compiles. Resolved lazily:
    // jostleProviderJar() is defined further down this file, after this block is evaluated.
    dependencies {
        testImplementation files({ rootProject.jostleProviderJar() })
    }

    // The suite always runs against JSL. When TEST_FIPS_LIB names a FIPS module, `fipsTest` runs
    // the same classes again against JSLFIPS; tests needing an algorithm the FIPS module does not
    // implement skip themselves via JslTestProvider.assumeAlgorithm.
    //
    // TEST_FIPS_LIB is declared as a task input on purpose. Gradle's up-to-date check hashes task
    // inputs, not the environment, so without this a task that last ran with the variable unset is
    // considered UP-TO-DATE when re-run with it set and replays a cached all-skipped result as
    // BUILD SUCCESSFUL in milliseconds. (Bitten in the openssl-jostle repo; see
    // .claude/guides/testing.md.)
    tasks.register('fipsTest', Test) {
        description = 'Runs the test suite against the JSLFIPS provider (requires TEST_FIPS_LIB).'
        group = 'verification'

        onlyIf { System.getenv('TEST_FIPS_LIB') != null }

        testClassesDirs = sourceSets.test.output.classesDirs
        classpath = sourceSets.test.runtimeClasspath

        systemProperty 'test.jsl.provider', 'JSLFIPS'
        inputs.property('fipsLib', System.getenv('TEST_FIPS_LIB') ?: '')
    }

    // Same reasoning for the ordinary test task: it registers JSLFIPS too when the variable is
    // set, so its result depends on the variable as well.
    tasks.named('test').configure {
        inputs.property('fipsLib', System.getenv('TEST_FIPS_LIB') ?: '')
    }

    // core carries no tests of its own, but it still compiles the shared test support above, so
    // "sources present, nothing discovered" is expected rather than a misconfiguration.
    tasks.withType(Test).configureEach {
        failOnNoDiscoveredTests = false
    }

    // Each leg is followed by a gate summary. A junit.framework.TestCase gate returns early and
    // JUnit records that as a PASS, so a JSLFIPS leg reads as "412 tests, 0 failures" while a large
    // fraction of them did nothing - measured 2026-09-08 as 108 of 412 on a 3.5.8 module and 125 on
    // a 3.1.2 one, against 5 and 16 reported skips. Every gate prints a "[skipped]" line, so
    // counting those beside the skips Gradle reports makes the gap visible without reading the XML.
    //
    // Two deliberate choices. It is wired with finalizedBy rather than doLast, because a Test task
    // throws on failure inside its own action and doLast would then be skipped - exactly when the
    // summary matters most. And the count is of MARKER LINES, i.e. gated executions rather than
    // distinct tests: Gradle writes <system-out> at suite level, not per <testcase>, so per-test
    // attribution is not recoverable from the XML. The line says so rather than implying precision
    // it does not have.
    ['test', 'fipsTest'].each { legName ->
        def summary = tasks.register("${legName}GateSummary") {
            description = "Counts gated executions beside reported skips for ${legName}."
            def xmlDir = layout.buildDirectory.dir("test-results/${legName}")
            def moduleName = project.name

            // Mirror the leg's own onlyIf. Without this, a run with TEST_FIPS_LIB unset skips
            // fipsTest but the summary still finds the PREVIOUS run's XML and reports it as though
            // this run had produced it.
            if (legName == 'fipsTest')
            {
                onlyIf { System.getenv('TEST_FIPS_LIB') != null }
            }

            doLast {
                def dir = xmlDir.get().asFile
                if (!dir.isDirectory())
                {
                    return
                }

                int tests = 0, failed = 0, skips = 0, silent = 0
                dir.listFiles()?.each { f ->
                    if (!f.name.endsWith('.xml'))
                    {
                        return
                    }
                    def suite = new groovy.xml.XmlSlurper().parse(f)
                    tests  += ((suite.@tests.text() ?: '0') as int)
                    failed += ((suite.@failures.text() ?: '0') as int) + ((suite.@errors.text() ?: '0') as int)
                    skips  += ((suite.@skipped.text() ?: '0') as int)
                    silent += f.text.count('[skipped]')
                }

                if (tests > 0)
                {
                    logger.lifecycle("${moduleName} ${legName}: tests=${tests} failures=${failed}" +
                        " reported-skips=${skips} silent-skips=${silent}" +
                        " (silent-skips = gated executions, not distinct tests)")
                }
            }
        }

        tasks.named(legName).configure { finalizedBy(summary) }
    }

    // The compat artifact name carries the -jsl qualifier (bccore-jsl, bcutil-jsl, ...).
    ext.artifactBaseName = "bc${project.name == 'core' ? 'core' : project.name}-jsl"

    // Whether this module resolves anything through JCA and so needs the provider at all, and at
    // which scope: tls exposes provider types in its own exported API and needs the jar to compile,
    // so its consumers do too; the rest only resolve services at run time.
    ext.usesProvider = project.name != 'util'
    ext.providerScope = project.name == 'tls' ? 'compile' : 'runtime'

    afterEvaluate {
        // Deliberately sourceCompatibility/targetCompatibility rather than options.release: under
        // --release 9 java.activation is a real platform module exporting javax.activation, which
        // collides with the `activation` automatic module mail's descriptor also names. Safe here
        // because this source set holds module-info.java alone and compiles against no platform API.
        tasks.named('compileJava9Java').configure {
            sourceCompatibility = 9
            targetCompatibility = 9
            options.sourcepath = files(['src/main/java', 'src/main/java9'])
            options.compilerArgs << '-implicit:none'

            def required = rootProject.ext.moduleRequires[project.name]
            required.each { dependsOn ":${it}:jar" }

            doFirst {
                def entries = required.collect {
                    rootProject.project(":${it}").tasks.getByName('jar').archiveFile.get().asFile.path
                } + project.ext.java9ExtraModulePath().collect { it.toString() }

                options.compilerArgs += ['--module-path', entries.join(File.pathSeparator)]
            }
        }

        jar {
            archiveBaseName = project.ext.artifactBaseName

            // The descriptor is read by a JDK 9+ consumer only; release-8 consumers see the jar
            // exactly as before.
            into('META-INF/versions/9') {
                from sourceSets.java9.output
            }

            // OSGi bundle headers (processed by the bnd builder plugin).
            String v = rootProject.ext.bundle_version
            String rawExports = rootProject.ext.osgiExportPattern
            // Attach ;version to each exported package clause (skip bnd exclusions).
            String exportHeader = rawExports.split(',').collect { c ->
                c.startsWith('!') ? c : "${c};version=${v}"
            }.join(',')

            manifest.attributes(
                "Specification-Vendor"      : "BouncyCastle.org",
                "Specification-Version"     : "1.0",
                "Implementation-Vendor"     : "BouncyCastle.org",
                "Implementation-Version"    : project.version,
                "Multi-Release"             : "true",
                "Bundle-Name"               : project.ext.artifactBaseName,
                "Bundle-SymbolicName"       : project.ext.artifactBaseName,
                "Bundle-Version"            : v,
                "Bundle-RequiredExecutionEnvironment" : "JavaSE-1.8",
                "-exportcontents"           : exportHeader,
                "Import-Package"            : "java.*;resolution:=optional,javax.*;resolution:=optional,org.bouncycastle.jsl.*;version=\"[${v},${project.maxVersion})\",*"
            )
        }

        task sourcesJar(type: Jar, dependsOn: classes) {
            archiveBaseName = project.ext.artifactBaseName
            archiveClassifier = 'sources'
            from sourceSets.main.allSource

            // The descriptor is a source file like any other, and a sources jar without it cannot
            // be recompiled into the jar it documents.
            into('META-INF/versions/9') {
                from sourceSets.java9.allSource
            }
        }

        task javadocJar(type: Jar, dependsOn: javadoc) {
            archiveBaseName = project.ext.artifactBaseName
            archiveClassifier = 'javadoc'
            from javadoc.destinationDir
        }

        artifacts {
            archives jar
            archives sourcesJar
            archives javadocJar
        }

        // Neither bc-java nor jostle ships Gradle Module Metadata; a .module file here would make
        // these the only artifacts in the family that carry one.
        tasks.withType(GenerateModuleMetadata).configureEach {
            enabled = false
        }

        publishing {
            publications {
                maven(MavenPublication) {
                    groupId = publishProperty('jslGroupId')
                    artifactId = project.ext.artifactBaseName

                    from components.java
                    artifact sourcesJar
                    artifact javadocJar

                    pom {
                        name = project.ext.artifactBaseName
                        description = "${project.name} for the OpenSSL Jostle (JSL) provider, rebuilt from bc-java"
                        // Providers, not values: these are read when a POM is generated, so an
                        // ordinary build does not trip the guard on a property only publishing needs.
                        url = providers.provider { rootProject.ext.publishProperty('jslProjectUrl') }

                        licenses {
                            license {
                                name = providers.provider { rootProject.ext.publishProperty('jslLicenceName') }
                                url = providers.provider { rootProject.ext.publishProperty('jslLicenceUrl') }
                            }
                        }

                        // The copyright-holding groups, as jostle's POM names them. This repo has no
                        // AUTHORS file; individual contributors are left to the revision history.
                        developers {
                            developer {
                                id = 'bouncycastle'
                                name = 'Legion of the Bouncy Castle Inc.'
                                url = 'https://www.bouncycastle.org'
                            }
                            developer {
                                id = 'openssl'
                                name = 'OpenSSL Software Services, Inc.'
                                url = 'https://www.openssl.org'
                            }
                        }

                        scm {
                            def scmUrl = providers.provider { rootProject.ext.publishProperty('jslScmUrl') }
                            connection = scmUrl.map { "scm:git:${it}.git".toString() }
                            developerConnection = scmUrl.map { "scm:git:${it}.git".toString() }
                            url = scmUrl
                        }

                        // The provider is reached through JCA, so only tls names it at compile time
                        // and `from components.java` would leave it out of the POMs of the modules
                        // that call it at run time. Measured by JCA service references in main:
                        // core 13, pkix 84, pg 23, tls 32, mail 2, util 0 - util is asn.1 only and
                        // resolves nothing, so it alone does not declare the provider. Consumers add
                        // the arch bundle for their platform as jostle's README documents; this names
                        // the umbrella POM, with no classifier.
                        if (project.ext.usesProvider)
                        {
                            withXml {
                                def root = asNode()
                                def existing = root.get('dependencies')
                                def deps = existing.isEmpty() ? root.appendNode('dependencies') : existing.get(0)
                                def node = deps.appendNode('dependency')
                                node.appendNode('groupId', 'org.openssl.jostle')
                                node.appendNode('artifactId', 'openssl-jostle')
                                node.appendNode('version', rootProject.jostleVersion)
                                node.appendNode('scope', project.ext.providerScope)
                            }
                        }
                    }
                }
            }

            repositories {
                maven {
                    // Staging only: render the repository tree, upload nothing. The publish job
                    // PGP-signs it on the HSM and uploads. Snapshots stage too, so they cannot skip
                    // signing.
                    name = 'staging'
                    def remote = rootProject.findProperty('centralReleaseUrl')
                    url = remote ?: layout.buildDirectory.dir('staging-deploy').get().asFile.toURI().toString()

                    // Gradle refuses to attach an authentication scheme to a file:// repository and
                    // validates the credentials even when it would never use them.
                    if (remote)
                    {
                        credentials {
                            username = System.getenv('CENTRAL_USERNAME')
                            password = System.getenv('CENTRAL_PASSWORD')
                        }
                    }
                }
            }
        }
    }
}

// Three assertions, each falsified RED on its own before this landed: the bundle holds
// what the module compiled (catches a pattern that pulls a package nothing else owns),
// exports everything it holds (catches a package silently left unexported), and shares
// no package with another bundle (the split that fails module-path resolution).
tasks.register('checkBundlePackages') {
    description = 'Asserts each bundle holds exactly the packages its module compiled, exports all of them, and shares none.'
    group = 'verification'

    def jars = subprojects.collectEntries { sp ->
        [(sp.name): [jar    : sp.tasks.named('jar').flatMap { it.archiveFile },
                     classes: sp.sourceSets.main.output.classesDirs]]
    }
    dependsOn subprojects.collect { it.tasks.named('jar') }

    doLast {
        // Split an OSGi header on its top-level commas: a clause's uses:= and version
        // attributes carry quoted commas of their own.
        def clausesOf = { String header ->
            def out = []
            def cur = new StringBuilder()
            boolean quoted = false
            header.each { ch ->
                if (ch == '"')
                {
                    quoted = !quoted
                    cur.append(ch)
                }
                else if (ch == ',' && !quoted)
                {
                    out << cur.toString()
                    cur = new StringBuilder()
                }
                else
                {
                    cur.append(ch)
                }
            }
            out << cur.toString()
            out*.trim().findAll { !it.isEmpty() }
        }

        def held = [:]
        def problems = []

        jars.each { name, loc ->
            def inJar = [] as Set
            def exported = [] as Set

            new java.util.jar.JarFile(loc.jar.get().asFile).withCloseable { jf ->
                jf.entries().each { e ->
                    // META-INF/versions/<n>/ holds the module descriptor and any multi-release
                    // overlay; deriving a package from those paths invents one per version
                    // directory (586 of them on the jostle jar, measured).
                    if (e.name.endsWith('.class') && e.name.contains('/')
                            && !e.name.startsWith('META-INF/')
                            && !e.name.endsWith('/module-info.class'))
                    {
                        inJar << e.name.substring(0, e.name.lastIndexOf('/')).replace('/', '.')
                    }
                }
                String header = jf.manifest?.mainAttributes?.getValue('Export-Package') ?: ''
                clausesOf(header).each { c ->
                    if (!c.startsWith('!'))
                    {
                        exported << (c.contains(';') ? c.substring(0, c.indexOf(';')) : c)
                    }
                }
            }

            def compiled = [] as Set
            loc.classes.each { dir ->
                if (dir.isDirectory())
                {
                    fileTree(dir).matching { include '**/*.class' }.each { f ->
                        def rel = dir.toPath().relativize(f.toPath()).toString()
                        if (rel.contains(File.separator))
                        {
                            compiled << rel.substring(0, rel.lastIndexOf(File.separator)).replace(File.separator, '.')
                        }
                    }
                }
            }

            def pulled = inJar - compiled
            def lost = compiled - inJar
            def unexported = inJar - exported
            def phantom = exported - inJar

            if (!pulled.isEmpty())
            {
                problems << "${name}: bundle carries ${pulled.size()} package(s) the module never compiled: ${pulled.sort()}"
            }
            if (!lost.isEmpty())
            {
                problems << "${name}: bundle is missing ${lost.size()} compiled package(s): ${lost.sort()}"
            }
            if (!unexported.isEmpty())
            {
                problems << "${name}: bundle holds ${unexported.size()} package(s) it does not export: ${unexported.sort()}"
            }
            if (!phantom.isEmpty())
            {
                problems << "${name}: bundle exports ${phantom.size()} package(s) it does not hold: ${phantom.sort()}"
            }

            held[name] = inJar
        }

        def owners = [:].withDefault { [] }
        held.each { name, pkgs -> pkgs.each { owners[it] << name } }
        owners.findAll { pkg, mods -> mods.size() > 1 }.sort().each { pkg, mods ->
            problems << "split package ${pkg} is held by ${mods.sort()}"
        }

        if (!problems.isEmpty())
        {
            throw new GradleException("bundle package check failed:\n  " + problems.join("\n  "))
        }

        logger.lifecycle("bundle package check: ${held.size()} bundles, " +
            "${held.values().sum { it.size() }} packages, each compiled, exported and owned once")
    }
}

subprojects { sp -> sp.tasks.named('check').configure { dependsOn rootProject.tasks.named('checkBundlePackages') } }

// A POM that disagrees with the descriptor beside it is worse than either alone: the module path
// and the dependency resolver then hand a consumer different graphs. This derives the expectation
// from module-info.java, so the descriptors stay the single source of truth. `requires static` is
// optional by definition, so those coordinates are permitted but not demanded.
tasks.register('checkPublishedPoms') {
    description = 'Asserts each generated POM declares exactly what its module descriptor requires.'
    group = 'verification'

    // jslProjectUrl and jslScmUrl are deliberately unset until this fork's public home is decided,
    // and generating a POM without them fails by design. So the POM tasks are depended on only when
    // the publication is complete: otherwise this skips loudly rather than failing `check` for
    // everyone, and it starts running the moment they are set.
    def unset = ['jslGroupId', 'jslLicenceName', 'jslLicenceUrl', 'jslProjectUrl', 'jslScmUrl'].findAll {
        def v = rootProject.findProperty(it)
        v == null || v.toString().trim().isEmpty()
    }

    if (unset.isEmpty())
    {
        dependsOn subprojects.collect { "${it.path}:generatePomFileForMavenPublication" }
    }

    onlyIf {
        if (!unset.isEmpty())
        {
            logger.lifecycle("SKIPPED checkPublishedPoms: publication properties unset (${unset.join(', ')})")
        }
        unset.isEmpty()
    }

    def modules = subprojects.collectEntries { sp ->
        [(sp.name): [descriptor   : sp.file('src/main/java9/module-info.java'),
                     pom          : sp.layout.buildDirectory.file('publications/maven/pom-default.xml'),
                     usesProvider : sp.ext.usesProvider]]
    }
    def group = rootProject.findProperty('jslGroupId')?.toString()
    def providerCoord = 'org.openssl.jostle:openssl-jostle'

    // Module name -> coordinate. The javax pair are the automatic-module names mail's descriptor
    // carries; the java.* spellings of them resolve to no artifact at all.
    def coordinateOf = { String moduleName ->
        if (moduleName.startsWith('org.bouncycastle.jsl.'))
        {
            def shortName = moduleName.substring('org.bouncycastle.jsl.'.length())
            return "${group}:bc${shortName}-jsl".toString()
        }
        if (moduleName == 'org.openssl.jostle.prov') { return providerCoord }
        if (moduleName == 'mail') { return 'javax.mail:mail' }
        if (moduleName == 'activation') { return 'javax.activation:activation' }
        return null
    }

    doLast {
        def problems = []

        modules.each { name, m ->
            def required = [] as Set
            def optional = [] as Set

            // Derived from the descriptor, never from the flag that wrote the POM: a `requires
            // transitive` on the provider means its types are in this module's exported API, so a
            // consumer compiling against this module compiles against the provider too.
            def expectedProviderScope = 'runtime'

            m.descriptor.eachLine { line ->
                def match = line.trim() =~ /^requires\s+(static\s+|transitive\s+)*([A-Za-z0-9_.]+)\s*;/
                if (match.find())
                {
                    def moduleName = match.group(2)
                    if (moduleName.startsWith('java.') && !moduleName.startsWith('java.mail')
                            && !moduleName.startsWith('java.activation'))
                    {
                        return
                    }
                    def coordinate = coordinateOf(moduleName)
                    if (coordinate == null)
                    {
                        return
                    }
                    if (coordinate == providerCoord && line.contains('requires transitive'))
                    {
                        expectedProviderScope = 'compile'
                    }

                    (line.contains('requires static') ? optional : required) << coordinate
                }
            }

            if (m.usesProvider)
            {
                required << providerCoord
            }

            def declared = [] as Set
            def scopes = [:]
            def pom = new groovy.xml.XmlSlurper().parse(m.pom.get().asFile)
            pom.dependencies.dependency.each { d ->
                def coordinate = "${d.groupId.text()}:${d.artifactId.text()}".toString()
                declared << coordinate
                scopes[coordinate] = d.scope.text()
            }

            // The provider's scope is the difference between a consumer that compiles against this
            // module and one that merely runs it.
            if (m.usesProvider && scopes[providerCoord] != expectedProviderScope)
            {
                problems << "${name}: provider dependency is scope '${scopes[providerCoord]}'," +
                    " but the descriptor asks for '${expectedProviderScope}'"
            }

            def missing = required - declared
            def unexpected = declared - required - optional

            if (!missing.isEmpty())
            {
                problems << "${name}: POM is missing ${missing.sort()}, which its descriptor requires"
            }
            if (!unexpected.isEmpty())
            {
                problems << "${name}: POM declares ${unexpected.sort()}, which its descriptor does not require"
            }
        }

        if (!problems.isEmpty())
        {
            throw new GradleException("published POM check failed:\n  " + problems.join("\n  "))
        }

        logger.lifecycle("published POM check: ${modules.size()} POMs agree with their module descriptors")
    }
}

// Convenience accessor for the jostle provider jar used by subprojects.
ext.jostleProviderJar = jostleJar
